[tox]
# Running tests against min/max only to speed up local iterations (all versions tested in GH actions)
envlist = py{310,314}, py314-no-click, coverage, style, ty, pyrefly, pyright, mypy

[testenv]
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
usedevelop = True
deps = -rtests/requirements.txt
commands = pytest {posargs:-vv --cov=src --cov-report=xml --doctest-modules src tests}

[testenv:py314-no-click]
# click is an optional dependency: verify that runez works without it (same deps as tests/requirements.txt, minus click)
deps = freezegun
       psutil
       pytest
       requests
       urllib3
commands = python -c "import runez, runez.click"
           pytest {posargs:-vv tests}

[testenv:coverage]
setenv = COVERAGE_FILE={toxworkdir}/.coverage
skip_install = True
deps = coverage
commands = coverage combine
           coverage report -m
           coverage xml
           coverage html

[testenv:doctest]
usedevelop = True
deps = -rtests/requirements.txt
commands = pytest --doctest-modules {posargs:}

[testenv:style]
skip_install = True
deps = ruff
commands = ruff check
           ruff format --diff
           python "{toxinidir}/tests/extra-validations"

[testenv:reformat]
skip_install = True
deps = ruff
commands = ruff check --fix
           ruff format

# Type checkers: the CI workflows choose which ones gate, see docs/ci/code-quality.md
[testenv:basedpyright]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = basedpyright
       setuptools
       -rtests/requirements.txt
# Without --pythonpath, basedpyright resolves imports against ./.venv rather than this tox env
commands = basedpyright --pythonpath {envpython} {posargs}

[testenv:mypy]
# types-psutil, types-setuptools: unlike the other checkers, mypy insists on separate stubs for these
deps = mypy
       types-psutil
       types-setuptools
       -rtests/requirements.txt
commands = mypy {posargs}

[testenv:pyrefly]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = pyrefly
       setuptools
       -rtests/requirements.txt
commands = pyrefly check {posargs}

[testenv:pyright]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = pyright
       setuptools
       -rtests/requirements.txt
commands = pyright {posargs}

[testenv:ty]
# setuptools: for setup.py's import to resolve (uv venvs don't include it)
deps = ty
       setuptools
       -rtests/requirements.txt
commands = ty check {posargs}

[testenv:zuban]
# types-setuptools: zuban, like mypy, insists on separate stubs for it
deps = zuban
       types-setuptools
       -rtests/requirements.txt
# Without --python-executable, zuban doesn't resolve imports against this tox env
commands = zuban check --python-executable {envpython} {posargs}


[coverage:run]
concurrency =
    thread
patch = subprocess
[coverage:xml]
output = .tox/test-reports/coverage.xml
[coverage:html]
directory = .tox/test-reports/htmlcov

[pytest]
cache_dir = .tox/pytest_cache
