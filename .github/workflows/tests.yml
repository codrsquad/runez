name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@v10.2.0
    - run: uvx --with tox-uv tox -e py

  linters:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v10.2.0
    - run: uvx --with tox-uv tox -e style,ty,pyrefly,pyright,mypy

  no-click:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v10.2.0
    - run: uvx --with tox-uv tox -e py314-no-click

  ripple-effect:

    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v10.2.0
    - run: uvx ripple-effect run
