[build-system]
requires = ["setuptools", "setupmeta"]
build-backend = "setuptools.build_meta"

[project]
name = "runez"
authors = [
    {name = "Zoran Simic", email = "zoran@simicweb.com"},
]
description = "Friendly misc/utils/convenience library"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/codrsquad/runez"

[tool.pyright]  # also read by basedpyright (it refuses a pyproject that has both sections)
pythonVersion = "3.10"
include = ["src", "tests", "setup.py"]

[tool.mypy]  # also read by zuban
python_version = "3.10"
files = ["src", "tests", "setup.py"]
# "Missing return statement": falling off the end to return None is fine
# "annotation-unchecked": a note, repeated for every annotated function mypy doesn't check (unannotated ones)
disable_error_code = ["return", "annotation-unchecked"]

[[tool.mypy.overrides]]
# Tests check state, call something, and check again (also: assert that a None-returning call returns None)
module = ["tests.*"]
warn_unreachable = false
disable_error_code = ["func-returns-value"]

[[tool.mypy.overrides]]
# runez.schema is on its way out (v6.0): its declarative fields and with_behavior() bases can't be typed
module = ["tests.test_schema", "tests.test_serialize"]
disable_error_code = ["assignment", "misc"]

[tool.pyrefly]  # without this section, pyrefly adopts [tool.pyright] (or [tool.mypy])
python-version = "3.10"
project-includes = ["src", "tests", "setup.py"]
search-path = ["src", "."]  # "src" first: with "." first, src/runez files get seen under two module names

[[tool.pyrefly.sub-config]]
matches = "tests/test_schema.py"  # runez.schema is on its way out (v6.0), its declarative fields can't be typed
errors = { bad-assignment = false, bad-override-mutable-attribute = false, invalid-inheritance = false }

[[tool.pyrefly.sub-config]]
matches = "tests/test_serialize.py"  # Same for the schema-supporting half of runez.serialize (with_behavior() bases)
errors = { invalid-inheritance = false }

[[tool.ty.overrides]]
# Tests check state, call something, and check again: ty assumes a call leaves attributes as they were
include = ["tests/**"]
rules = { redundant-condition = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_schema.py"]  # runez.schema is on its way out (v6.0), its declarative fields can't be typed
rules = { invalid-assignment = "ignore" }

[tool.ruff]
cache-dir = ".tox/.ruff_cache"
line-length = 140

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
#    "D",   # pydocstyle
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "EXE", # flake8-executable
    "F",   # pyflakes
    "FLY", # flynt
    "G",   # flake8-logging-format
    "I",   # isort
    "INT", # flake8-gettext
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PT", # flake8-pytest
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RUF", # ruff-specific
    "S", #flake8-bandit
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "TD", # flake8-todos
    "TRY", # tryceratops
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"src/runez/__init__.py" = ["I"]
"src/runez/conftest.py" = ["S101"]
"src/runez/http.py" = ["S101"]
"src/runez/serialize.py" = ["S101"]
"tests/**" = ["ARG001", "S", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
